<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Javascript</title>
</head>
<body>
    <div class="Box4">
        This is the 6th session of javascript.
        <p>We will learn about alert, prompt and confirm</p>
        
        <script>
            // alert doesn't return anything
            alert("download compelete")

            //prompt
            let name=prompt("Enter your name","enter your name")
            console.log(name)

            //confirm
            let deletpost=confirm("do you really want to delete tour post")
            console.log(deletpost)

            if(deletpost) console.log("your post has been deleted successfully")
            else console.log("your post cannot be deleted")
        </script>
        
    </div>
</body>
</html>
