<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript</title>
    <script>
        var str="This is is is is is a string"
        console.log(str)
        var pos1=str.indexOf("is")
        console.log(pos1)
        var pos2=str.lastIndexOf('is')
        console.log(pos2)
        var substr=str.slice(2,5)
        console.log(substr)
        var substr1=str.substr(3,7)
        console.log(substr1)
        var replaced=str.replace('string','India')
        console.log(replaced)
        var newString=str.concat(' Country')
        console.log(newString)
        var ch=str.charAt(5)
        console.log(ch)
        var ch1=str.charCodeAt(3)
        console.log(ch1)
        console.log(str[5])
        const a="This is a constant content"
        console.log(a)
        let b="a"
        console.log(b)


    </script>
</head>
<body>
    <div class="Box1">
        This is the 3rd session of javascript.
        <p>We will learn about string</p>
    </div>
</body>
</html>
