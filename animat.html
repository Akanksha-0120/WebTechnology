<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <script type="texr/javascript"></script>
    <style type="text/css">
        .animated{
            width: 100px;
            height: 100px;
            text-align: center;
            background-color: rgb(5, 9, 145);
            transition: width 2s, height 4s border-radius 5s, background-color 5s;
        }
        .animated:hover{
            width: 300px;
            width: 300px;
            border-radius: 50%;
            background-color: rgb(199, 24, 24);
        }
    </style>
</head>
<body>
    <div class="animated">jadu</div>
</body>
</html>
